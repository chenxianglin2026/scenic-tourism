<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../css/admin.css">
<style>
  .chart-section { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }
  .chart-bars { display:flex; align-items:flex-end; gap:8px; height:160px; padding:0 10px; }
  .chart-bar-col { flex:1; display:flex; flex-direction:column; align-items:center; }
  .chart-bar-fill { width:100%; max-width:50px; border-radius:4px 4px 0 0; background:linear-gradient(180deg, #c8a052, #e0c882); transition:height .4s; min-height:2px; }
  .chart-bar-fill.rev { background:linear-gradient(180deg, #c8a052, #e0c882); }
  .chart-bar-fill.sold { background:linear-gradient(180deg, #4a90d9, #7ab3f0); }
  .chart-bar-label { font-size:10px; color:var(--text-muted); margin-top:4px; }
  .chart-bar-val { font-size:10px; color:var(--gold-dark); margin-bottom:2px; font-weight:600; }
  .loading, .empty { text-align:center; padding:24px; color:var(--text-muted); font-size:13px; }
  @media (max-width:768px) { .chart-section { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="page">

  <!-- Stat Cards -->
  <div class="stat-cards" id="statCards">
    <div class="loading">加载中...</div>
  </div>

  <!-- Charts Row -->
  <div class="chart-section">
    <div class="card">
      <div class="card-header"><div class="card-title">近7天票务营收趋势（元）</div></div>
      <div class="chart-bars" id="revenueChart"><div class="loading">加载中...</div></div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">近7天售票趋势（张）</div></div>
      <div class="chart-bars" id="soldChart"><div class="loading">加载中...</div></div>
    </div>
  </div>

</div>

<script>
(function() {
  var token = localStorage.getItem('scenic_token');
  if (!token) { window.top.location.href = 'pages/login.html'; return; }
  var headers = { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };

  function fmtMoney(n) { return '¥' + Number(n||0).toLocaleString('zh-CN', {minimumFractionDigits:0,maximumFractionDigits:0}); }

  function renderStatCards(d) {
    var cards = [
      { icon:'🎫', cls:'gold', val: d.tickets_sold_today || 0, label: '今日售票', sub: '有效售票数量' },
      { icon:'🚶', cls:'green', val: d.tickets_verified_today || 0, label: '今日入园', sub: '已核销验票' },
      { icon:'🏨', cls:'blue', val: d.occupied_rooms || 0, label: '今日客房入住', sub: '已占用房间数' },
      { icon:'💰', cls:'gold', val: fmtMoney(d.total_revenue_today), label: '今日营收', sub: '票务+酒店总收入' }
    ];
    document.getElementById('statCards').innerHTML = cards.map(function(s) {
      return '<div class="stat-card">' +
        '<div class="stat-icon ' + s.cls + '">' + s.icon + '</div>' +
        '<div class="stat-info">' +
          '<div class="stat-value">' + s.val + '</div>' +
          '<div class="stat-label">' + s.label + '</div>' +
          (s.sub ? '<div class="stat-change" style="font-size:11px;">' + s.sub + '</div>' : '') +
        '</div>' +
      '</div>';
    }).join('');
  }

  function renderChart(id, trend, cls, fmt) {
    var el = document.getElementById(id);
    if (!trend || !trend.length) {
      el.innerHTML = '<div class="empty">暂无数据</div>';
      return;
    }
    var max = Math.max.apply(null, trend.map(function(t) { return t.value; }));
    if (max === 0) max = 1;
    el.innerHTML = trend.map(function(t) {
      var h = Math.max(t.value / max * 140, 2);
      return '<div class="chart-bar-col">' +
        '<div class="chart-bar-val">' + fmt(t.value) + '</div>' +
        '<div class="chart-bar-fill ' + cls + '" style="height:' + h + 'px;" title="' + t.label + ': ' + t.value + '"></div>' +
        '<div class="chart-bar-label">' + t.label + '</div>' +
      '</div>';
    }).join('');
  }

  async function load() {
    try {
      var res = await fetch('/api/admin/dashboard/stats', { headers: headers });
      if (res.status === 401 || res.status === 403) {
        window.top.location.href = 'pages/login.html';
        return;
      }
      var json = await res.json();
      var d = json.data || json;
      renderStatCards(d);
      renderChart('revenueChart', d.ticket_revenue_trend, 'rev', function(v) {
        return v > 0 ? '¥' + (v/10000).toFixed(1) + 'w' : '';
      });
      renderChart('soldChart', d.tickets_sold_trend, 'sold', function(v) {
        return v > 0 ? v + '张' : '';
      });
    } catch(e) {
      document.getElementById('statCards').innerHTML = '<div class="loading" style="color:var(--error);">加载失败: ' + e.message + '</div>';
    }
  }

  load();
  setInterval(load, 30000);
})();
</script>
</body>
</html>
