<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../css/admin.css">
<style>
  .chart-section { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }
  .chart-bars { display:flex; align-items:flex-end; gap:8px; height:160px; padding:0 10px; }
  .chart-bar-col { flex:1; display:flex; flex-direction:column; align-items:center; }
  .chart-bar-fill { width:100%; max-width:50px; border-radius:4px 4px 0 0; background:linear-gradient(180deg, #c8a052, #e0c882); transition:height .4s; min-height:2px; }
  .chart-bar-fill.rev { background:linear-gradient(180deg, #c8a052, #e0c882); }
  .chart-bar-fill.sold { background:linear-gradient(180deg, #4a90d9, #7ab3f0); }
  .chart-bar-fill.parking { background:linear-gradient(180deg, #52c41a, #95de64); }
  .chart-bar-label { font-size:10px; color:var(--text-muted); margin-top:4px; }
  .chart-bar-val { font-size:10px; color:var(--gold-dark); margin-bottom:2px; font-weight:600; }
  .loading, .empty { text-align:center; padding:24px; color:var(--text-muted); font-size:13px; }
  .loading-wrap { display:flex; align-items:center; justify-content:center; padding:24px; color:var(--text-muted); font-size:13px; gap:8px; }
  .spinner { display:inline-block; width:18px; height:18px; border:2px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin .6s linear infinite; vertical-align:middle; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .skeleton { background:linear-gradient(90deg, #f0ede4 25%, #e8e4d8 50%, #f0ede4 75%); background-size:200% 100%; animation:shimmer 1.5s ease-in-out infinite; border-radius:4px; }
  @keyframes shimmer { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }
  .sk-card { height:88px; border-radius:var(--radius); }
  .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .info-item { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border); }
  .info-item:last-child { border-bottom:none; }
  .info-label { font-size:12px; color:var(--text-muted); width:80px; flex-shrink:0; }
  .info-value { font-size:13px; color:var(--text-primary); font-weight:500; }
  .rating-stars { color:var(--gold); font-size:16px; letter-spacing:2px; }
  .parking-row { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:12px; }
  .parking-mini-card { background:#faf8f3; border-radius:8px; padding:14px; border:1px solid var(--border); }
  .parking-mini-card .pmc-title { font-size:13px; font-weight:600; color:var(--text-primary); margin-bottom:8px; }
  .parking-mini-card .pmc-row { display:flex; justify-content:space-between; font-size:12px; color:var(--text-secondary); margin-bottom:4px; }
  .revenue-table { width:100%; border-collapse:collapse; font-size:12px; margin-top:12px; }
  .revenue-table th { background:#faf8f3; padding:8px 10px; text-align:left; font-weight:600; color:var(--text-secondary); border-bottom:2px solid var(--border); }
  .revenue-table td { padding:8px 10px; border-bottom:1px solid var(--border); }
  .revenue-table tbody tr:hover { background:rgba(200,160,82,.04); }
  .revenue-summary { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
  .revenue-summary .rv-item { background:#faf8f3; border-radius:8px; padding:14px; text-align:center; border:1px solid var(--border); }
  .revenue-summary .rv-value { font-size:20px; font-weight:700; color:var(--gold-dark); }
  .revenue-summary .rv-label { font-size:11px; color:var(--text-muted); margin-top:4px; }
  .rv-item:first-child .rv-value { color:var(--gold-dark); }
  .rv-item:nth-child(2) .rv-value { color:#4a90d9; }
  .rv-item:nth-child(3) .rv-value { color:#52c41a; }
  .rv-item:last-child .rv-value { color:#cf1322; }
  .period-selector { display:flex; gap:8px; }
  .period-btn { padding:4px 12px; border:1px solid var(--border); border-radius:4px; cursor:pointer; font-size:12px; background:var(--bg-white); color:var(--text-secondary); }
  .period-btn.active { background:var(--gold); color:#fff; border-color:var(--gold); }
  .review-stat-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .review-stat-row .rs-item { display:flex; align-items:center; gap:8px; }
  .review-stat-row .rs-label { font-size:12px; color:var(--text-muted); width:56px; flex-shrink:0; }
  .review-stat-row .rs-bar-bg { flex:1; height:8px; background:#f0ede4; border-radius:4px; overflow:hidden; }
  .review-stat-row .rs-bar-fill { height:100%; background:linear-gradient(90deg, #c8a052, #e0c882); border-radius:4px; }
  .review-stat-row .rs-count { font-size:11px; color:var(--text-muted); width:40px; text-align:right; flex-shrink:0; }
  @media (max-width:768px) {
  .chart-section,.info-grid,.revenue-summary,.review-stat-row { grid-template-columns:1fr; }
  .btn,button,.period-btn { padding:12px 18px; min-width:44px; min-height:44px; font-size:14px }
  input,select,textarea { font-size:16px; padding:12px; width:100% }
  table { display:block; width:100% }
  table thead { display:none }
  table tbody,table tr { display:block; width:100% }
  table td { display:block; width:100%; padding:12px; border-bottom:1px solid var(--border); position:relative }
  table td:before { content:attr(data-label); font-weight:600; color:var(--text-muted); font-size:12px; display:block; margin-bottom:4px }
  .page { padding:12px }
}
</style>
</head>
<body>
<div class="page">

  <!-- Breadcrumb -->
  <div class="breadcrumb-bar" style="display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:13px;color:var(--text-muted);">
    <span style="color:var(--gold-dark);">🏠 首页</span>
    <span>/</span>
    <span style="color:var(--text-primary);font-weight:600;">数据看板</span>
    <span style="margin-left:auto;font-size:14px;color:var(--text-primary);font-weight:600;" id="dashboardClock">--</span>
    <button class="btn btn-outline btn-sm" onclick="refreshAll()" title="手动刷新" style="margin-left:8px;padding:2px 10px;font-size:12px;">🔄 刷新</button>
    <span id="liveIndicator" style="font-size:11px;color:var(--text-muted);margin-left:4px;"></span>
  </div>

  <!-- Stat Cards -->
  <div class="stat-cards" id="statCards">
    <div class="skeleton sk-card"></div>
    <div class="skeleton sk-card"></div>
    <div class="skeleton sk-card"></div>
    <div class="skeleton sk-card"></div>
    <div class="skeleton sk-card"></div>
  </div>

  <!-- Charts Row -->
  <div class="chart-section">
    <div class="card">
      <div class="card-header"><div class="card-title">近7天票务营收趋势（元）</div></div>
      <div class="chart-bars" id="revenueChart"><div class="loading-wrap"><span class="spinner"></span>加载中...</div></div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">近7天售票趋势（张）</div></div>
      <div class="chart-bars" id="soldChart"><div class="loading-wrap"><span class="spinner"></span>加载中...</div></div>
    </div>
  </div>

  <!-- Scenic Info + Parking Overview -->
  <div class="chart-section">
    <div class="card">
      <div class="card-header"><div class="card-title">🏞️ 景区概况</div></div>
      <div id="scenicInfo"><div class="loading-wrap"><span class="spinner"></span>加载中...</div></div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">🅿️ 停车概览</div></div>
      <div id="parkingOverview"><div class="loading-wrap"><span class="spinner"></span>加载中...</div></div>
    </div>
  </div>

  <!-- Revenue Report -->
  <div class="card">
    <div class="card-header">
      <div class="card-title">💰 营收报表</div>
      <div class="period-selector" id="periodSelector">
        <button class="period-btn active" data-period="day">按日</button>
        <button class="period-btn" data-period="week">按周</button>
        <button class="period-btn" data-period="month">按月</button>
      </div>
    </div>
    <div class="revenue-summary" id="revenueSummary"><div class="loading-wrap"><span class="spinner"></span>加载中...</div></div>
    <div style="overflow-x:auto;">
      <table class="revenue-table" id="revenueTable"><thead><tr><th>日期</th><th>票务营收</th><th>酒店营收</th><th>停车营收</th><th>合计</th></tr></thead><tbody><tr><td colspan="5"><div class="loading-wrap"><span class="spinner"></span>加载中...</div></td></tr></tbody></table>
    </div>
  </div>

  <!-- Review Stats -->
  <div class="chart-section">
    <div class="card">
      <div class="card-header"><div class="card-title">⭐ 评价统计</div></div>
      <div id="reviewStatsCard"><div class="loading-wrap"><span class="spinner"></span>加载中...</div></div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">📊 评分分布</div></div>
      <div id="reviewDistCard"><div class="loading-wrap"><span class="spinner"></span>加载中...</div></div>
    </div>
  </div>

</div>

<script>
(function() {
  var token = localStorage.getItem('scenic_token');
  if (!token) { window.top.location.href = 'pages/login.html'; return; }
  var headers = { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };

  function fmtMoney(n) { return '¥' + Number(n||0).toLocaleString('zh-CN', {minimumFractionDigits:0,maximumFractionDigits:0}); }

  function renderStatCards(d) {
    var cards = [
      { icon:'🎫', cls:'gold', val: d.tickets_sold_today || 0, label: '今日售票', sub: '有效售票数量' },
      { icon:'🚶', cls:'green', val: d.tickets_verified_today || 0, label: '今日入园', sub: '已核销验票' },
      { icon:'🏨', cls:'blue', val: d.occupied_rooms || 0, label: '今日客房入住', sub: '已占用房间数' },
      { icon:'🅿️', cls:'green', val: (d.parking_active_count || 0), label: '在场车辆', sub: '停车中: ' + fmtMoney(d.parking_revenue_today || 0) + ' 今日收入' },
      { icon:'💰', cls:'gold', val: fmtMoney(d.total_revenue_today), label: '今日营收', sub: '票务+酒店+停车总收入' }
    ];
    document.getElementById('statCards').innerHTML = cards.map(function(s) {
      return '<div class="stat-card">' +
        '<div class="stat-icon ' + s.cls + '">' + s.icon + '</div>' +
        '<div class="stat-info">' +
          '<div class="stat-value">' + s.val + '</div>' +
          '<div class="stat-label">' + s.label + '</div>' +
          (s.sub ? '<div class="stat-change" style="font-size:11px;">' + s.sub + '</div>' : '') +
        '</div>' +
      '</div>';
    }).join('');
    // Update last-updated indicator
    var liveEl = document.getElementById('liveIndicator');
    if (liveEl && d.last_updated) {
      liveEl.textContent = '更新于 ' + d.last_updated;
      liveEl.style.color = 'var(--gold-dark)';
      setTimeout(function() { liveEl.style.color = 'var(--text-muted)'; }, 2000);
    }
  }

  function renderChart(id, trend, cls, fmt) {
    var el = document.getElementById(id);
    if (!trend || !trend.length) {
      el.innerHTML = '<div class="empty">暂无数据</div>';
      return;
    }
    var max = Math.max.apply(null, trend.map(function(t) { return t.value; }));
    if (max === 0) max = 1;
    el.innerHTML = trend.map(function(t) {
      var h = Math.max(t.value / max * 140, 2);
      return '<div class="chart-bar-col">' +
        '<div class="chart-bar-val">' + fmt(t.value) + '</div>' +
        '<div class="chart-bar-fill ' + cls + '" style="height:' + h + 'px;" title="' + t.label + ': ' + t.value + '"></div>' +
        '<div class="chart-bar-label">' + t.label + '</div>' +
      '</div>';
    }).join('');
  }

  function catLabel(c) {
    var map = { notice:'通知', event:'活动', maintenance:'维护', emergency:'紧急' };
    return map[c] || c || '通知';
  }

  function catTag(c) {
    var map = { notice:'tag-blue', event:'tag-gold', maintenance:'tag-warm', emergency:'tag-red' };
    return '<span class="tag ' + (map[c]||'tag-gray') + '">' + catLabel(c) + '</span>';
  }

  function renderScenicInfo(info) {
    var el = document.getElementById('scenicInfo');
    if (!info || !info.name) {
      el.innerHTML = '<div class="empty">暂无景区信息</div>';
      return;
    }
    var stars = '';
    var r = info.rating || 0;
    for (var i = 1; i <= 5; i++) { stars += (i <= Math.round(r)) ? '★' : '☆'; }
    var annItems = (info.latest_announcements || []).slice(0, 3);

    var html = '<div class="info-grid">' +
      '<div class="info-item"><span class="info-label">景区名称</span><span class="info-value">' + (info.name||'--') + '</span></div>' +
      '<div class="info-item"><span class="info-label">景区评分</span><span class="info-value"><span class="rating-stars">' + stars + '</span> ' + (info.rating||'--') + '</span></div>' +
      '<div class="info-item"><span class="info-label">所在城市</span><span class="info-value">' + (info.city||'--') + ' ' + (info.district||'') + '</span></div>' +
      '<div class="info-item"><span class="info-label">联系电话</span><span class="info-value">' + (info.phone||'--') + '</span></div>' +
      '<div class="info-item"><span class="info-label">开放时间</span><span class="info-value">' + (info.open_time||'--') + ' ~ ' + (info.close_time||'--') + '</span></div>' +
      '<div class="info-item"><span class="info-label">日限流量</span><span class="info-value">' + (info.daily_limit ? info.daily_limit.toLocaleString() : '--') + ' 人</span></div>' +
      '<div class="info-item"><span class="info-label">票种数量</span><span class="info-value">' + ((info.ticket_types||[]).length) + ' 种</span></div>' +
      '<div class="info-item"><span class="info-label">景区状态</span><span class="info-value">' + (info.is_active ? '<span class="tag tag-green">运营中</span>' : '<span class="tag tag-gray">已停用</span>') + '</span></div>' +
    '</div>';

    if (annItems.length) {
      html += '<div style="margin-top:12px;font-size:12px;color:var(--text-muted);font-weight:600;">📢 最新公告</div>';
      html += annItems.map(function(a) {
        return '<div style="padding:6px 0;border-bottom:1px dashed var(--border);font-size:12px;">' +
          catTag(a.category) + ' <b>' + (a.title||'') + '</b>' +
          '<span style="color:var(--text-muted);margin-left:8px;">' + (a.published_at ? new Date(a.published_at).toLocaleDateString('zh-CN') : '') + '</span>' +
        '</div>';
      }).join('');
    }

    el.innerHTML = html;
  }

  function renderParkingOverview(data) {
    var el = document.getElementById('parkingOverview');
    var items = data.items || [];
    if (!items.length) {
      el.innerHTML = '<div class="empty">暂无停车数据</div>';
      return;
    }

    var totalRecords = data.total || 0;
    var activeParking = items.filter(function(r) { return r.status === 'parking'; }).length;
    var today = new Date().toISOString().slice(0,10);
    var todayRecords = items.filter(function(r) {
      return r.checkin_time && String(r.checkin_time).slice(0,10) === today;
    });
    var todayRevenue = todayRecords.reduce(function(sum, r) { return sum + (r.total_fee || 0); }, 0);

    var html = '<div class="stat-cards" style="grid-template-columns:1fr 1fr;gap:10px;">' +
      '<div class="stat-card" style="padding:14px;">' +
        '<div class="stat-icon gold">📋</div>' +
        '<div class="stat-info"><div class="stat-value" style="font-size:20px;">' + totalRecords + '</div><div class="stat-label">停车记录总数</div></div>' +
      '</div>' +
      '<div class="stat-card" style="padding:14px;">' +
        '<div class="stat-icon green">🅿️</div>' +
        '<div class="stat-info"><div class="stat-value" style="font-size:20px;">' + activeParking + '</div><div class="stat-label">在场车辆</div></div>' +
      '</div>' +
      '<div class="stat-card" style="padding:14px;">' +
        '<div class="stat-icon blue">🚗</div>' +
        '<div class="stat-info"><div class="stat-value" style="font-size:20px;">' + todayRecords.length + '</div><div class="stat-label">今日停车记录</div></div>' +
      '</div>' +
      '<div class="stat-card" style="padding:14px;">' +
        '<div class="stat-icon gold">¥</div>' +
        '<div class="stat-info"><div class="stat-value" style="font-size:20px;">' + fmtMoney(todayRevenue) + '</div><div class="stat-label">今日停车收入</div></div>' +
      '</div>' +
    '</div>';

    el.innerHTML = html;
  }

  async function loadDashboard() {
    try {
      var res = await fetch('/scenic/api/dashboard/stats', { headers: headers });
      if (res.status === 401 || res.status === 403) {
        window.top.location.href = 'pages/login.html';
        return;
      }
      var json = await res.json();
      var d = json.data || json;
      renderStatCards(d);
      renderChart('revenueChart', d.ticket_revenue_trend, 'rev', function(v) {
        return v > 0 ? '¥' + (v/10000).toFixed(1) + 'w' : '';
      });
      renderChart('soldChart', d.tickets_sold_trend, 'sold', function(v) {
        return v > 0 ? v + '张' : '';
      });
    } catch(e) {
      document.getElementById('statCards').innerHTML = '<div class="loading" style="color:var(--error);">核心数据加载失败: ' + e.message + '</div>';
    }

    // Load scenic info
    try {
      var scenicRes = await fetch('/scenic/api/scenic/info');
      if (scenicRes.status === 401 || scenicRes.status === 403) {
        window.top.location.href = 'pages/login.html';
        return;
      }
      if (scenicRes.ok) {
        var scenicData = await scenicRes.json();
        renderScenicInfo(scenicData);
      } else {
        document.getElementById('scenicInfo').innerHTML = '<div class="empty">景区信息加载失败</div>';
      }
    } catch(e) {
      document.getElementById('scenicInfo').innerHTML = '<div class="empty">景区信息加载失败: ' + e.message + '</div>';
    }

    // Load parking overview (admin all records)
    try {
      var parkRes = await fetch('/scenic/api/parking/records/all', { headers: headers });
      if (parkRes.status === 401 || parkRes.status === 403) {
        window.top.location.href = 'pages/login.html';
        return;
      }
      if (parkRes.ok) {
        var parkData = await parkRes.json();
        renderParkingOverview(parkData);
      } else {
        document.getElementById('parkingOverview').innerHTML = '<div class="empty">停车数据加载失败</div>';
      }
    } catch(e) {
      document.getElementById('parkingOverview').innerHTML = '<div class="empty">停车数据加载失败: ' + e.message + '</div>';
    }
  }

  // ── 营收报表 ─────────────────────────────────────────
  var currentPeriod = 'day';

  function renderRevenueSummary(summary) {
    document.getElementById('revenueSummary').innerHTML =
      '<div class="rv-item"><div class="rv-value">' + fmtMoney(summary.ticket_revenue || 0) + '</div><div class="rv-label">🎫 票务营收</div></div>' +
      '<div class="rv-item"><div class="rv-value">' + fmtMoney(summary.hotel_revenue || 0) + '</div><div class="rv-label">🏨 酒店营收</div></div>' +
      '<div class="rv-item"><div class="rv-value">' + fmtMoney(summary.parking_revenue || 0) + '</div><div class="rv-label">🅿️ 停车营收</div></div>' +
      '<div class="rv-item"><div class="rv-value">' + fmtMoney(summary.total_revenue || 0) + '</div><div class="rv-label">📊 总收入</div></div>';
  }

  function renderRevenueTable(items) {
    var tbody = document.getElementById('revenueTable').querySelector('tbody');
    if (!items || !items.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty">暂无营收数据</td></tr>';
      return;
    }
    tbody.innerHTML = items.map(function(r) {
      var label = r.period || r.date || r.label || '--';
      return '<tr>' +
        '<td>' + label + '</td>' +
        '<td>' + fmtMoney(r.ticket_revenue || 0) + '</td>' +
        '<td>' + fmtMoney(r.hotel_revenue || 0) + '</td>' +
        '<td>' + fmtMoney(r.parking_revenue || 0) + '</td>' +
        '<td style="font-weight:600;color:var(--gold-dark);">' + fmtMoney(r.total_revenue || 0) + '</td>' +
      '</tr>';
    }).join('');
  }

  async function loadRevenueReport(period) {
    try {
      var res = await fetch('/scenic/api/dashboard/revenue?period=' + period, { headers: headers });
      if (res.status === 401 || res.status === 403) {
        window.top.location.href = 'pages/login.html';
        return;
      }
      var json = await res.json();
      var d = json.data || json;
      renderRevenueSummary(d.summary || {});
      renderRevenueTable(d.items || []);
    } catch(e) {
      document.getElementById('revenueSummary').innerHTML = '<div class="loading" style="color:var(--error);">营收报表加载失败: ' + e.message + '</div>';
      document.getElementById('revenueTable').querySelector('tbody').innerHTML = '<tr><td colspan="5" class="empty">加载失败</td></tr>';
    }
  }

  // Period selector
  document.getElementById('periodSelector').addEventListener('click', function(e) {
    var btn = e.target.closest('.period-btn');
    if (!btn) return;
    var period = btn.dataset.period;
    if (currentPeriod === period) return;
    currentPeriod = period;
    document.querySelectorAll('#periodSelector .period-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    loadRevenueReport(period);
  });

  // ── 评价统计 ─────────────────────────────────────────

  function renderReviewStats(data) {
    var el = document.getElementById('reviewStatsCard');
    var avg = data.avg_rating || 0;
    var total = data.total || 0;
    var dist = data.rating_distribution || {};
    var fiveCount = parseInt(dist['5']) || 0;
    var fiveRate = total > 0 ? Math.round(fiveCount / total * 100) : 0;

    var stars = '';
    for (var i = 1; i <= 5; i++) { stars += (i <= Math.round(avg)) ? '★' : '☆'; }

    el.innerHTML =
      '<div class="stat-cards" style="grid-template-columns:1fr 1fr;gap:12px;">' +
        '<div class="stat-card" style="padding:16px;">' +
          '<div class="stat-icon gold">⭐</div>' +
          '<div class="stat-info"><div class="stat-value" style="font-size:28px;">' + avg + '</div><div class="stat-label">平均评分</div></div>' +
        '</div>' +
        '<div class="stat-card" style="padding:16px;">' +
          '<div class="stat-icon blue">💬</div>' +
          '<div class="stat-info"><div class="stat-value" style="font-size:28px;">' + total + '</div><div class="stat-label">评价总数</div></div>' +
        '</div>' +
        '<div class="stat-card" style="padding:16px;">' +
          '<div class="stat-icon green">👍</div>' +
          '<div class="stat-info"><div class="stat-value" style="font-size:28px;">' + fiveCount + '</div><div class="stat-label">5分好评</div></div>' +
        '</div>' +
        '<div class="stat-card" style="padding:16px;">' +
          '<div class="stat-icon gold">📈</div>' +
          '<div class="stat-info"><div class="stat-value" style="font-size:28px;">' + fiveRate + '%</div><div class="stat-label">好评率</div></div>' +
        '</div>' +
      '</div>';
  }

  function renderReviewDist(data) {
    var el = document.getElementById('reviewDistCard');
    var dist = data.rating_distribution || {};
    var total = data.total || 0;
    if (Object.keys(dist).length === 0) {
      el.innerHTML = '<div class="empty">暂无评价数据</div>';
      return;
    }
    var html = '';
    for (var i = 5; i >= 1; i--) {
      var count = parseInt(dist[String(i)]) || 0;
      var pct = total > 0 ? Math.min(Math.round(count / total * 100), 100) : 0;
      html += '<div class="review-stat-row" style="margin-bottom:8px;">' +
        '<div class="rs-item">' +
          '<span class="rs-label">' + i + '分</span>' +
          '<div class="rs-bar-bg"><div class="rs-bar-fill" style="width:' + pct + '%;"></div></div>' +
          '<span class="rs-count">' + count + '</span>' +
        '</div>' +
      '</div>';
    }
    el.innerHTML = html;
  }

  async function loadReviewStats() {
    try {
      var res = await fetch('/scenic/api/scenic/reviews?page=1&page_size=1', { headers: headers });
      if (res.status === 401 || res.status === 403) {
        window.top.location.href = 'pages/login.html';
        return;
      }
      if (!res.ok) {
        document.getElementById('reviewStatsCard').innerHTML = '<div class="empty">评价数据加载失败</div>';
        document.getElementById('reviewDistCard').innerHTML = '<div class="empty">评价数据加载失败</div>';
        return;
      }
      var json = await res.json();
      var d = json.data || json;
      renderReviewStats(d);
      renderReviewDist(d);
    } catch(e) {
      document.getElementById('reviewStatsCard').innerHTML = '<div class="empty">评价数据加载失败: ' + e.message + '</div>';
      document.getElementById('reviewDistCard').innerHTML = '<div class="empty">评价数据加载失败</div>';
    }
  }

  // ── 主加载函数补充 ──────────────────────────────────
  function loadDashboardExtended() {
    loadRevenueReport(currentPeriod);
    loadReviewStats();
  }

  function refreshAll() {
    loadDashboard();
    loadDashboardExtended();
  }

  loadDashboard();
  loadDashboardExtended();
  setInterval(loadDashboard, 30000);
  setInterval(loadDashboardExtended, 60000);

  // Real-time clock
  function updateClock() {
    var now = new Date();
    var str = now.getFullYear() + '年' +
      (now.getMonth()+1) + '月' +
      now.getDate() + '日 ' +
      String(now.getHours()).padStart(2,'0') + ':' +
      String(now.getMinutes()).padStart(2,'0') + ':' +
      String(now.getSeconds()).padStart(2,'0');
    var el = document.getElementById('dashboardClock');
    if (el) el.textContent = str;
  }
  updateClock();
  setInterval(updateClock, 1000);
})();
</script>
</body>
</html>
