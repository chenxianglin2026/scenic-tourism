<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../css/admin.css">
<style>
  .chart-section { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px; }
  .chart-bars { display:flex; align-items:flex-end; gap:8px; height:160px; padding:0 10px; }
  .chart-bar-col { flex:1; display:flex; flex-direction:column; align-items:center; }
  .chart-bar-fill { width:100%; max-width:50px; border-radius:4px 4px 0 0; background:linear-gradient(180deg, #c8a052, #e0c882); transition:height .4s; min-height:2px; }
  .chart-bar-fill.rev { background:linear-gradient(180deg, #c8a052, #e0c882); }
  .chart-bar-fill.sold { background:linear-gradient(180deg, #4a90d9, #7ab3f0); }
  .chart-bar-label { font-size:10px; color:var(--text-muted); margin-top:4px; }
  .chart-bar-val { font-size:10px; color:var(--gold-dark); margin-bottom:2px; font-weight:600; }
  .loading, .empty { text-align:center; padding:24px; color:var(--text-muted); font-size:13px; }
  .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .info-item { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border); }
  .info-item:last-child { border-bottom:none; }
  .info-label { font-size:12px; color:var(--text-muted); width:80px; flex-shrink:0; }
  .info-value { font-size:13px; color:var(--text-primary); font-weight:500; }
  .rating-stars { color:var(--gold); font-size:16px; letter-spacing:2px; }
  .parking-row { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:12px; }
  .parking-mini-card { background:#faf8f3; border-radius:8px; padding:14px; border:1px solid var(--border); }
  .parking-mini-card .pmc-title { font-size:13px; font-weight:600; color:var(--text-primary); margin-bottom:8px; }
  .parking-mini-card .pmc-row { display:flex; justify-content:space-between; font-size:12px; color:var(--text-secondary); margin-bottom:4px; }
  @media (max-width:768px) { .chart-section,.info-grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="page">

  <!-- Stat Cards -->
  <div class="stat-cards" id="statCards">
    <div class="loading">加载中...</div>
  </div>

  <!-- Charts Row -->
  <div class="chart-section">
    <div class="card">
      <div class="card-header"><div class="card-title">近7天票务营收趋势（元）</div></div>
      <div class="chart-bars" id="revenueChart"><div class="loading">加载中...</div></div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">近7天售票趋势（张）</div></div>
      <div class="chart-bars" id="soldChart"><div class="loading">加载中...</div></div>
    </div>
  </div>

  <!-- Scenic Info + Parking Overview -->
  <div class="chart-section">
    <div class="card">
      <div class="card-header"><div class="card-title">🏞️ 景区概况</div></div>
      <div id="scenicInfo"><div class="loading">加载中...</div></div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">🅿️ 停车概览</div></div>
      <div id="parkingOverview"><div class="loading">加载中...</div></div>
    </div>
  </div>

</div>

<script>
(function() {
  var token = localStorage.getItem('scenic_token');
  if (!token) { window.top.location.href = 'pages/login.html'; return; }
  var headers = { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };

  function fmtMoney(n) { return '¥' + Number(n||0).toLocaleString('zh-CN', {minimumFractionDigits:0,maximumFractionDigits:0}); }

  function renderStatCards(d) {
    var cards = [
      { icon:'🎫', cls:'gold', val: d.tickets_sold_today || 0, label: '今日售票', sub: '有效售票数量' },
      { icon:'🚶', cls:'green', val: d.tickets_verified_today || 0, label: '今日入园', sub: '已核销验票' },
      { icon:'🏨', cls:'blue', val: d.occupied_rooms || 0, label: '今日客房入住', sub: '已占用房间数' },
      { icon:'💰', cls:'gold', val: fmtMoney(d.total_revenue_today), label: '今日营收', sub: '票务+酒店总收入' }
    ];
    document.getElementById('statCards').innerHTML = cards.map(function(s) {
      return '<div class="stat-card">' +
        '<div class="stat-icon ' + s.cls + '">' + s.icon + '</div>' +
        '<div class="stat-info">' +
          '<div class="stat-value">' + s.val + '</div>' +
          '<div class="stat-label">' + s.label + '</div>' +
          (s.sub ? '<div class="stat-change" style="font-size:11px;">' + s.sub + '</div>' : '') +
        '</div>' +
      '</div>';
    }).join('');
  }

  function renderChart(id, trend, cls, fmt) {
    var el = document.getElementById(id);
    if (!trend || !trend.length) {
      el.innerHTML = '<div class="empty">暂无数据</div>';
      return;
    }
    var max = Math.max.apply(null, trend.map(function(t) { return t.value; }));
    if (max === 0) max = 1;
    el.innerHTML = trend.map(function(t) {
      var h = Math.max(t.value / max * 140, 2);
      return '<div class="chart-bar-col">' +
        '<div class="chart-bar-val">' + fmt(t.value) + '</div>' +
        '<div class="chart-bar-fill ' + cls + '" style="height:' + h + 'px;" title="' + t.label + ': ' + t.value + '"></div>' +
        '<div class="chart-bar-label">' + t.label + '</div>' +
      '</div>';
    }).join('');
  }

  function catLabel(c) {
    var map = { notice:'通知', event:'活动', maintenance:'维护', emergency:'紧急' };
    return map[c] || c || '通知';
  }

  function catTag(c) {
    var map = { notice:'tag-blue', event:'tag-gold', maintenance:'tag-warm', emergency:'tag-red' };
    return '<span class="tag ' + (map[c]||'tag-gray') + '">' + catLabel(c) + '</span>';
  }

  function renderScenicInfo(info) {
    var el = document.getElementById('scenicInfo');
    if (!info || !info.name) {
      el.innerHTML = '<div class="empty">暂无景区信息</div>';
      return;
    }
    var stars = '';
    var r = info.rating || 0;
    for (var i = 1; i <= 5; i++) { stars += (i <= Math.round(r)) ? '★' : '☆'; }
    var annItems = (info.latest_announcements || []).slice(0, 3);

    var html = '<div class="info-grid">' +
      '<div class="info-item"><span class="info-label">景区名称</span><span class="info-value">' + (info.name||'--') + '</span></div>' +
      '<div class="info-item"><span class="info-label">景区评分</span><span class="info-value"><span class="rating-stars">' + stars + '</span> ' + (info.rating||'--') + '</span></div>' +
      '<div class="info-item"><span class="info-label">所在城市</span><span class="info-value">' + (info.city||'--') + ' ' + (info.district||'') + '</span></div>' +
      '<div class="info-item"><span class="info-label">联系电话</span><span class="info-value">' + (info.phone||'--') + '</span></div>' +
      '<div class="info-item"><span class="info-label">开放时间</span><span class="info-value">' + (info.open_time||'--') + ' ~ ' + (info.close_time||'--') + '</span></div>' +
      '<div class="info-item"><span class="info-label">日限流量</span><span class="info-value">' + (info.daily_limit ? info.daily_limit.toLocaleString() : '--') + ' 人</span></div>' +
      '<div class="info-item"><span class="info-label">票种数量</span><span class="info-value">' + ((info.ticket_types||[]).length) + ' 种</span></div>' +
      '<div class="info-item"><span class="info-label">景区状态</span><span class="info-value">' + (info.is_active ? '<span class="tag tag-green">运营中</span>' : '<span class="tag tag-gray">已停用</span>') + '</span></div>' +
    '</div>';

    if (annItems.length) {
      html += '<div style="margin-top:12px;font-size:12px;color:var(--text-muted);font-weight:600;">📢 最新公告</div>';
      html += annItems.map(function(a) {
        return '<div style="padding:6px 0;border-bottom:1px dashed var(--border);font-size:12px;">' +
          catTag(a.category) + ' <b>' + (a.title||'') + '</b>' +
          '<span style="color:var(--text-muted);margin-left:8px;">' + (a.published_at ? new Date(a.published_at).toLocaleDateString('zh-CN') : '') + '</span>' +
        '</div>';
      }).join('');
    }

    el.innerHTML = html;
  }

  function renderParkingOverview(data) {
    var el = document.getElementById('parkingOverview');
    var items = data.items || [];
    if (!items.length) {
      el.innerHTML = '<div class="empty">暂无停车数据</div>';
      return;
    }

    var totalRecords = data.total || 0;
    var activeParking = items.filter(function(r) { return r.status === 'parking'; }).length;
    var today = new Date().toISOString().slice(0,10);
    var todayRecords = items.filter(function(r) {
      return r.checkin_time && String(r.checkin_time).slice(0,10) === today;
    });
    var todayRevenue = todayRecords.reduce(function(sum, r) { return sum + (r.total_fee || 0); }, 0);

    var html = '<div class="stat-cards" style="grid-template-columns:1fr 1fr;gap:10px;">' +
      '<div class="stat-card" style="padding:14px;">' +
        '<div class="stat-icon gold">📋</div>' +
        '<div class="stat-info"><div class="stat-value" style="font-size:20px;">' + totalRecords + '</div><div class="stat-label">停车记录总数</div></div>' +
      '</div>' +
      '<div class="stat-card" style="padding:14px;">' +
        '<div class="stat-icon green">🅿️</div>' +
        '<div class="stat-info"><div class="stat-value" style="font-size:20px;">' + activeParking + '</div><div class="stat-label">在场车辆</div></div>' +
      '</div>' +
      '<div class="stat-card" style="padding:14px;">' +
        '<div class="stat-icon blue">🚗</div>' +
        '<div class="stat-info"><div class="stat-value" style="font-size:20px;">' + todayRecords.length + '</div><div class="stat-label">今日停车记录</div></div>' +
      '</div>' +
      '<div class="stat-card" style="padding:14px;">' +
        '<div class="stat-icon gold">¥</div>' +
        '<div class="stat-info"><div class="stat-value" style="font-size:20px;">' + fmtMoney(todayRevenue) + '</div><div class="stat-label">今日停车收入</div></div>' +
      '</div>' +
    '</div>';

    el.innerHTML = html;
  }

  async function loadDashboard() {
    try {
      var res = await fetch('/api/dashboard/stats', { headers: headers });
      if (res.status === 401 || res.status === 403) {
        window.top.location.href = 'pages/login.html';
        return;
      }
      var json = await res.json();
      var d = json.data || json;
      renderStatCards(d);
      renderChart('revenueChart', d.ticket_revenue_trend, 'rev', function(v) {
        return v > 0 ? '¥' + (v/10000).toFixed(1) + 'w' : '';
      });
      renderChart('soldChart', d.tickets_sold_trend, 'sold', function(v) {
        return v > 0 ? v + '张' : '';
      });
    } catch(e) {
      document.getElementById('statCards').innerHTML = '<div class="loading" style="color:var(--error);">核心数据加载失败: ' + e.message + '</div>';
    }

    // Load scenic info
    try {
      var scenicRes = await fetch('/api/scenic/info');
      if (scenicRes.ok) {
        var scenicData = await scenicRes.json();
        renderScenicInfo(scenicData);
      } else {
        document.getElementById('scenicInfo').innerHTML = '<div class="empty">景区信息加载失败</div>';
      }
    } catch(e) {
      document.getElementById('scenicInfo').innerHTML = '<div class="empty">景区信息加载失败: ' + e.message + '</div>';
    }

    // Load parking overview (admin all records)
    try {
      var parkRes = await fetch('/api/parking/records/all', { headers: headers });
      if (parkRes.ok) {
        var parkData = await parkRes.json();
        renderParkingOverview(parkData);
      } else {
        document.getElementById('parkingOverview').innerHTML = '<div class="empty">停车数据加载失败</div>';
      }
    } catch(e) {
      document.getElementById('parkingOverview').innerHTML = '<div class="empty">停车数据加载失败: ' + e.message + '</div>';
    }
  }

  loadDashboard();
  setInterval(loadDashboard, 30000);
})();
</script>
</body>
</html>
