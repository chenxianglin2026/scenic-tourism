<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../css/admin.css">
<style>
  .section { margin-bottom:24px; }
  .toast-msg { position:fixed; top:20px; left:50%; transform:translateX(-50%); padding:10px 24px; border-radius:6px; color:#fff; font-size:14px; z-index:9999; opacity:0; transition:opacity .3s; pointer-events:none; }
  .toast-msg.show { opacity:1; }
  .toast-msg.success { background:#52c41a; }
  .toast-msg.error { background:#f5222d; }
  .toast-msg.info { background:#1890ff; }
  .verify-modal { display:none; position:fixed; top:0;left:0;right:0;bottom:0; background:rgba(0,0,0,.45); align-items:center; justify-content:center; z-index:1000; }
  .verify-modal.show { display:flex; }
  .verify-box { background:#fff; border-radius:12px; padding:24px; width:420px; max-width:90vw; }
  .verify-result { padding:16px; border-radius:8px; margin-top:12px; text-align:center; font-size:14px; }
  .verify-result.success { background:rgba(82,196,26,.1); color:#389e0d; }
  .verify-result.fail { background:rgba(245,34,45,.1); color:#cf1322; }
  .verify-result.warn { background:rgba(250,173,20,.1); color:#d48806; }
  .tab-bar { display:flex; gap:0; margin-bottom:16px; border-bottom:2px solid var(--border); }
  .tab-item { padding:8px 20px; cursor:pointer; font-size:14px; color:var(--text-muted); border-bottom:2px solid transparent; margin-bottom:-2px; transition:var(--transition); }
  .tab-item.active { color:var(--gold-dark); border-bottom-color:var(--gold); font-weight:600; }
  .tab-content { display:none; }
  .tab-content.active { display:block; }
</style>
</head>
<body>
<div class="page">

  <!-- Breadcrumb -->
  <div class="breadcrumb-bar" style="display:flex;align-items:center;gap:8px;margin-bottom:16px;font-size:13px;color:var(--text-muted);">
    <span style="color:var(--gold-dark);">🏠 首页</span>
    <span>/</span>
    <span style="color:var(--text-primary);font-weight:600;">票务管理</span>
  </div>

  <div class="page-title">票务管理</div>

  <!-- Tabs -->
  <div class="tab-bar">
    <div class="tab-item active" data-tab="types">票种管理</div>
    <div class="tab-item" data-tab="orders">订单管理</div>
    <div class="tab-item" data-tab="verify">扫码核销</div>
  </div>

  <!-- Tab: 票种管理 -->
  <div class="tab-content active" id="tab-types">
    <div class="stat-cards" id="typeStatCards"></div>
    <div class="filter-bar">
      <button class="btn btn-primary btn-sm" onclick="showCreateTypeModal()">+ 新增票种</button>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">全部票种</div></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>票种名称</th>
              <th>类别</th>
              <th>价格</th>
              <th>原价</th>
              <th>库存/天</th>
              <th>年龄限制</th>
              <th>状态</th>
            </tr>
          </thead>
          <tbody id="typeList"><tr><td colspan="7" class="empty">加载中...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Tab: 订单管理 -->
  <div class="tab-content" id="tab-orders">
    <div class="filter-bar">
      <select class="form-select" id="orderStatusFilter">
        <option value="">全部状态</option>
        <option value="paid">已支付</option>
        <option value="verified">已核销</option>
        <option value="pending">待支付</option>
        <option value="cancelled">已取消</option>
        <option value="refunded">已退款</option>
        <option value="expired">已过期</option>
      </select>
      <button class="btn btn-primary btn-sm" onclick="loadOrders()">查询</button>
    </div>
    <div class="card">
      <div class="card-header">
        <div class="card-title">订单列表</div>
        <span style="font-size:12px;color:var(--text-muted);" id="orderTotal">--</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>订单号</th>
              <th>购票人</th>
              <th>票种</th>
              <th>数量</th>
              <th>游览日期</th>
              <th>时段</th>
              <th>金额</th>
              <th>状态</th>
              <th>下单时间</th>
            </tr>
          </thead>
          <tbody id="orderList"><tr><td colspan="9" class="empty">加载中...</td></tr></tbody>
        </table>
      </div>
      <div class="pagination" id="orderPager"></div>
    </div>
  </div>

  <!-- Tab: 扫码核销 -->
  <div class="tab-content" id="tab-verify">
    <div class="card">
      <div class="card-header"><div class="card-title">扫码核销验票</div></div>
      <div style="max-width:500px;">
        <div class="form-group">
          <label>二维码Token（扫码后手动输入或粘贴）</label>
          <input class="form-input" id="qrInput" placeholder="请输入或粘贴二维码token..." style="width:100%;">
        </div>
        <button class="btn btn-primary" onclick="verifyTicket()" style="width:100%;">核销验票</button>
        <div class="verify-result" id="verifyResult" style="display:none;"></div>
      </div>
    </div>
  </div>

</div>

<!-- Toast -->
<div class="toast-msg" id="toast"></div>

<script>
(function() {
  var token = localStorage.getItem('scenic_token');
  if (!token) { window.top.location.href = 'pages/login.html'; return; }
  var headers = { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };

  var ticketTypes = [];
  var orderPage = 1, orderPageSize = 20;

  // ── Toast ──
  function toast(msg, cls) {
    var el = document.getElementById('toast');
    el.textContent = msg; el.className = 'toast-msg show ' + (cls||'info');
    setTimeout(function() { el.classList.remove('show'); }, 2500);
  }

  // ── Tabs ──
  document.querySelectorAll('.tab-item').forEach(function(t) {
    t.addEventListener('click', function() {
      document.querySelectorAll('.tab-item').forEach(function(x) { x.classList.remove('active'); });
      document.querySelectorAll('.tab-content').forEach(function(x) { x.classList.remove('active'); });
      t.classList.add('active');
      document.getElementById('tab-' + t.dataset.tab).classList.add('active');
    });
  });

  function statusTag(s) {
    var map = { paid: ['已支付','tag-green'], verified: ['已核销','tag-gold'], pending: ['待支付','tag-warm'],
      cancelled: ['已取消','tag-gray'], refunded: ['已退款','tag-red'], expired: ['已过期','tag-gray'] };
    var m = map[s] || [s,'tag-gray'];
    return '<span class="tag ' + m[1] + '">' + m[0] + '</span>';
  }

  function categoryLabel(c) {
    var map = { adult:'成人票', child:'儿童票', senior:'老人票', group:'团体票', standard:'标准票' };
    return map[c] || c || '标准票';
  }

  function fmtMoney(n) { return '¥' + Number(n||0).toFixed(2); }
  function fmtDate(d) { if (!d) return '--'; return String(d).slice(0,10); }

  // ── Load Ticket Types ──
  async function loadTypes() {
    try {
      var res = await fetch('/api/tickets/types', { headers: headers });
      if (res.status === 401) { window.top.location.href = 'pages/login.html'; return; }
      ticketTypes = await res.json();
      renderTypes();
    } catch(e) { document.getElementById('typeList').innerHTML = '<tr><td colspan="7" class="empty">加载失败: '+e.message+'</td></tr>'; }
  }

  function renderTypes() {
    document.getElementById('typeStatCards').innerHTML = [
      { icon:'🎫', cls:'gold', val: ticketTypes.length, label: '票种总数' },
      { icon:'💰', cls:'green', val: '¥' + Math.min.apply(null, ticketTypes.map(function(t){return t.price;}).concat([0])).toFixed(0), label: '最低票价' },
      { icon:'💎', cls:'blue', val: '¥' + Math.max.apply(null, ticketTypes.map(function(t){return t.price;}).concat([0])).toFixed(0), label: '最高票价' }
    ].map(function(s) {
      return '<div class="stat-card"><div class="stat-icon ' + s.cls + '">' + s.icon + '</div><div class="stat-info"><div class="stat-value">' + s.val + '</div><div class="stat-label">' + s.label + '</div></div></div>';
    }).join('');

    document.getElementById('typeList').innerHTML = ticketTypes.length ? ticketTypes.map(function(t) {
      var age = (t.min_age || t.max_age) ? (t.min_age||'--') + '~' + (t.max_age||'--') + '岁' : '不限';
      return '<tr>' +
        '<td>' + t.name + '</td>' +
        '<td>' + categoryLabel(t.category) + '</td>' +
        '<td><b style="color:var(--gold-dark);">' + fmtMoney(t.price) + '</b></td>' +
        '<td>' + (t.original_price ? fmtMoney(t.original_price) : '--') + '</td>' +
        '<td>' + t.daily_stock + '</td>' +
        '<td>' + age + '</td>' +
        '<td><span class="tag ' + (t.is_active ? 'tag-green' : 'tag-gray') + '">' + (t.is_active ? '启用' : '禁用') + '</span></td>' +
      '</tr>';
    }).join('') : '<tr><td colspan="7" class="empty">暂无票种数据</td></tr>';
  }

  // ── Load Orders ──
  async function loadOrders(page) {
    if (page) orderPage = page;
    try {
      var status = document.getElementById('orderStatusFilter').value;
      var params = new URLSearchParams({ page: orderPage, page_size: orderPageSize });
      if (status) params.set('status', status);
      var res = await fetch('/api/tickets/orders?' + params, { headers: headers });
      if (res.status === 401) { window.top.location.href = 'pages/login.html'; return; }
      var json = await res.json();
      renderOrders(json);
    } catch(e) { document.getElementById('orderList').innerHTML = '<tr><td colspan="9" class="empty">加载失败: '+e.message+'</td></tr>'; }
  }

  function renderOrders(json) {
    var items = json.items || [];
    document.getElementById('orderTotal').textContent = '共 ' + (json.total||0) + ' 条';
    document.getElementById('orderList').innerHTML = items.length ? items.map(function(o) {
      return '<tr>' +
        '<td style="font-family:monospace;font-size:12px;">' + (o.order_no || '--') + '</td>' +
        '<td>' + (o.visitor_name || '--') + '</td>' +
        '<td>' + (o.ticket_type_name || '票种#'+o.ticket_type_id) + '</td>' +
        '<td>' + o.quantity + '张</td>' +
        '<td>' + fmtDate(o.visit_date) + '</td>' +
        '<td>' + (o.time_slot || '--') + '</td>' +
        '<td><b>' + fmtMoney(o.total_price) + '</b></td>' +
        '<td>' + statusTag(o.status) + '</td>' +
        '<td style="font-size:12px;">' + (o.created_at ? new Date(o.created_at).toLocaleString('zh-CN') : '--') + '</td>' +
      '</tr>';
    }).join('') : '<tr><td colspan="9" class="empty">暂无订单数据</td></tr>';

    var total = json.total || 0;
    var pages = Math.ceil(total / orderPageSize) || 1;
    var pager = '';
    for (var i = 1; i <= pages; i++) {
      pager += '<button class="page-btn' + (i === orderPage ? ' active' : '') + '" onclick="loadOrders(' + i + ')">' + i + '</button>';
    }
    document.getElementById('orderPager').innerHTML = pages > 1 ? pager : '';
  }

  // ── Verify Ticket ──
  window.verifyTicket = async function() {
    var qr = document.getElementById('qrInput').value.trim();
    if (!qr) { toast('请输入二维码token', 'error'); return; }
    try {
      var res = await fetch('/api/tickets/verify', { method:'POST', headers:headers, body:JSON.stringify({qr_token:qr}) });
      if (res.status === 401) { window.top.location.href = 'pages/login.html'; return; }
      var json = await res.json();
      var el = document.getElementById('verifyResult');
      el.style.display = 'block';
      if (json.result === 'success') {
        el.className = 'verify-result success';
        el.innerHTML = '✅ 核销成功<br>票种: ' + (json.order.ticket_type_name||'--') + '<br>购票人: ' + (json.order.visitor_name||'--') + '<br>数量: ' + json.order.quantity + '张';
        document.getElementById('qrInput').value = '';
        loadOrders(); // refresh order list
      } else if (json.result === 'already_verified') {
        el.className = 'verify-result warn';
        el.innerHTML = '⚠️ ' + json.message;
      } else {
        el.className = 'verify-result fail';
        el.innerHTML = '❌ ' + json.message;
      }
    } catch(e) { toast('核销失败: ' + e.message, 'error'); }
  };

  // init
  loadTypes();
  loadOrders();
})();
</script>
</body>
</html>
