version: "3.8"

services:
  scenic-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scenic-backend
    ports:
      - "8002:8002"
    environment:
      - DEV_MODE=true
      - APP_NAME=景区智慧管理系统
      - APP_VERSION=1.0.6
      - DEBUG=false
    volumes:
      - scenic_data:/app/data
    restart: unless-stopped

volumes:
  scenic_data:
