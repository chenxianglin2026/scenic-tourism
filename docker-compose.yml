version: "3.8"

services:
  # ── PostgreSQL 数据库 ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: scenic-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scenic}
      POSTGRES_USER: ${POSTGRES_USER:-scenic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scenic123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scenic} -d ${POSTGRES_DB:-scenic}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scenic-net

  # ── FastAPI 后端应用 ───────────────────────────────
  app:
    build: .
    image: scenic:latest
    container_name: scenic-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DEV_MODE=${DEV_MODE:-false}
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - WX_APPID=${WX_APPID}
      - WX_SECRET=${WX_SECRET}
    env_file:
      - .env
    expose:
      - "8000"
    networks:
      - scenic-net

  # ── Nginx 反向代理 + 静态文件 ─────────────────────
  nginx:
    image: nginx:alpine
    container_name: scenic-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - scenic-net

volumes:
  postgres_data:
    driver: local

networks:
  scenic-net:
    driver: bridge
