# 景区智慧管理系统 - Nginx 反向代理配置
# 域名: VPS 43.163.5.90

upstream backend {
    server app:8000;
}

server {
    listen 80;
    server_name localhost;

    # 日志
    access_log /var/log/nginx/scenic_access.log;
    error_log  /var/log/nginx/scenic_error.log;

    # ── API 请求 → FastAPI uvicorn:8000 ──────────────────────────
    location /api {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── Swagger 文档 ────────────────────────────────────────────
    location /docs {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /openapi.json {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── 健康检查 ────────────────────────────────────────────────
    location /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── 管理后台静态文件 + 默认路由 ──────────────────────────────
    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
