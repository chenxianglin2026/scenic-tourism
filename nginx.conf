server {
    listen 443 ssl;
    server_name 7yijia888.com www.7yijia888.com;
    ssl_certificate /etc/letsencrypt/live/7yijia888.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/7yijia888.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = / { root /var/www; try_files /index.html =404; }

    location /api/ { proxy_pass http://127.0.0.1:8001; proxy_set_header Host $host; }
    location /admin/ { alias /home/ubuntu/yijiaren/code/admin/; }
    location /docs { proxy_pass http://127.0.0.1:8001; proxy_set_header Host $host; }

    location /scenic/api/ { proxy_pass http://127.0.0.1:8002/api/; proxy_set_header Host $host; }
    location /scenic/admin/ { alias /home/ubuntu/projects/scenic/code/admin/; }
    location /scenic/ { proxy_pass http://127.0.0.1:8002/; proxy_set_header Host $host; }

    location /apartment/ {
        rewrite ^/apartment/api/water/meters /apartment/api/water/ttlock/list break;
        rewrite ^/apartment/api/electric/meters /apartment/api/electric/ttlock/list break;
        proxy_pass http://127.0.0.1:8000/;
    }
    location ~ /\. { deny all; }
}
server {
    listen 80;
    server_name yijia888vip.me www.yijia888vip.me yijia888vip.xyz www.yijia888vip.xyz;
    root /var/www/vip;
    index index.html;
}
